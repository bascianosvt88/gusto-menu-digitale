<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171916">
<title>Menù digitale | Gusto</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#171916;--paper:#fbfaf6;--green:#b7d900;--muted:#6c7067;--line:#e4e5dc;--white:#fff}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:12px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:var(--ink);color:white;text-align:center;padding:27px 16px 24px;border-bottom:5px solid var(--green)}
.logo{width:56px;height:56px;border:2px solid var(--green);border-radius:50%;display:grid;place-items:center;color:var(--green);font-size:30px;font-weight:950;margin:0 auto 8px}
.brand{font-size:34px;letter-spacing:3px;font-weight:950;line-height:1}
.tagline{margin-top:8px;color:#e6e8dd;font-size:13px;letter-spacing:.7px}
.strap{display:inline-block;margin-top:15px;border:1px solid #55594d;border-radius:99px;padding:7px 12px;font-size:10px;letter-spacing:1.3px;text-transform:uppercase}
main{max-width:920px;margin:auto;padding:20px 14px 38px}
.intro{text-align:center;padding:2px 0 18px}
.intro h1{font-size:25px;margin:0 0 6px;letter-spacing:.5px}
.intro p{font-size:13px;color:var(--muted);margin:0}
.status{margin:0 0 16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--muted);font-size:13px;line-height:1.45}
.status.error{border-color:#e6b9b9;background:#fff4f4;color:#8b2525}
nav{position:sticky;top:0;z-index:100;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:10px 0 12px;margin:0 -2px 4px;background:var(--paper);box-shadow:0 5px 10px rgba(23,25,22,.07);-webkit-overflow-scrolling:touch;scrollbar-width:thin}
nav a{flex:none;text-decoration:none;color:var(--ink);background:white;border:1px solid var(--line);border-radius:99px;padding:9px 13px;font-size:12px;font-weight:800;white-space:nowrap}
nav a.active{background:var(--green);border-color:var(--green)}
section{margin:22px 0 29px;scroll-margin-top:12px}
.section-head{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px;text-align:center}
.section-head:before,.section-head:after{content:"";height:3px;flex:1;min-width:18px;background:var(--green);border-radius:3px}
h2{font-size:23px;margin:0;font-weight:950;letter-spacing:.7px;text-transform:uppercase;text-align:center;line-height:1.15}
.count{font-size:11px;color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0}
.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:start}
.item{display:block;width:100%;margin:0 0 10px;background:var(--white);border:1px solid var(--line);border-radius:13px;overflow:hidden;min-width:0}
.item.has-photo{width:100%;max-width:100%}
.photo{display:block;width:100%;height:auto;max-height:none;object-fit:initial;background:transparent}
.itembody{padding:13px}
.item:not(.has-photo) .itembody{grid-column:1;grid-row:1}
.itemtop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.name{font-size:15px;font-weight:850;line-height:1.28;overflow-wrap:anywhere}
.price{white-space:nowrap;font-weight:950;font-size:14px;background:var(--green);border-radius:7px;padding:5px 7px}
.variant-list{display:grid;gap:6px;margin-top:9px}.variant-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fbfcf7;font-size:12px;line-height:1.3}.variant-name{font-weight:700;overflow-wrap:anywhere}.variant-price{white-space:nowrap;font-weight:900;background:var(--green);border-radius:6px;padding:4px 7px}
.desc{font-size:12px;line-height:1.45;color:var(--muted);margin:8px 0 0;white-space:pre-line}.info-label{font-size:11px;font-weight:900;letter-spacing:.5px;margin:10px 0 4px;color:var(--ink)}.ingredients{font-size:12px;line-height:1.45;color:var(--muted);margin:0;white-space:pre-line}
.no-products{text-align:center;padding:25px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);background:#fff}
footer{text-align:center;background:#eeefe7;padding:22px 15px;color:var(--muted);font-size:12px}
footer strong{color:var(--ink);letter-spacing:2px}
@media(max-width:480px){main{padding-left:11px;padding-right:11px}.items{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.item{margin-bottom:8px}.itembody{padding:10px}.name{font-size:13px}.price{font-size:12px;padding:5px 6px}.desc,.ingredients{font-size:11px}.photo{height:auto;max-height:none}.brand{font-size:31px}h2{font-size:20px}}
@media(min-width:700px){.items{grid-template-columns:repeat(3,minmax(0,1fr))}}

#printMenuBtn{display:block;margin:14px auto 0;padding:11px 18px;border:0;border-radius:9px;background:var(--green);color:var(--ink);font-weight:900;font-size:14px;cursor:pointer}
@media print{
 @page{size:A4 portrait;margin:7mm}
 html,body{background:#fff!important;color:#111!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 header{padding:5mm 0 3mm;background:#fff!important;color:#111!important;border-bottom:2px solid #111}
 .logo{display:none}
 .brand{font-size:19pt;color:#111!important}
 .tagline{color:#333!important;font-size:8pt;margin-top:2mm}
 .strap{display:none}
 main{max-width:none;margin:0;padding:3mm 0}
 .intro{padding:0 0 3mm}
 .intro h1{font-size:14pt;margin:0}
 .intro p,.status,nav,#printMenuBtn,footer{display:none!important}
 #menu{display:block}
 section{margin:0 0 3mm;break-before:auto!important;page-break-before:auto!important;break-inside:auto!important;page-break-inside:auto!important;scroll-margin:0}
 .section-head{margin:0 0 2mm;gap:3mm;break-after:avoid-page;page-break-after:avoid;text-align:center}
 .section-head:before,.section-head:after{width:auto;min-width:8mm;height:1mm;flex:1;background:#b7d900!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 h2{font-size:14pt;letter-spacing:.6px;white-space:normal}
 .count{font-size:7pt}
 .items{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:2mm!important;align-items:start}
 .item,.item.has-photo{display:block!important;width:100%!important;max-width:none!important;margin:0!important;border:0.25mm solid #bbb!important;border-radius:1.5mm!important;overflow:visible!important;break-inside:avoid;page-break-inside:avoid;background:#fff!important}
 .photo{display:none!important}
 .itembody{padding:2mm!important}
 .itemtop{gap:1mm}
 .name{font-size:9pt;line-height:1.2}
 .price{font-size:8.5pt;padding:1.2mm 1.5mm;border-radius:1mm;background:var(--green)!important;color:var(--ink)!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 .variant-list{gap:1mm;margin-top:1mm}
 .variant-row{padding:1.2mm;font-size:7.5pt;border-radius:1mm}
 .variant-price{padding:.5mm 1mm;background:var(--green)!important;color:var(--ink)!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 .desc,.ingredients{font-size:7.5pt;line-height:1.25;margin-top:1.2mm;color:#333!important}
 .info-label{font-size:6.8pt;margin:1.5mm 0 .7mm}
}

</style>
</head>
<body>
<header>
  <div class="logo">G</div>
  <div class="brand">GUSTO</div>
  <div class="tagline">Il piacere in tavola</div>
  <div class="strap">Gastronomia · Burger · Specialità</div>
</header>
<main>
  <div class="intro"><h1>IL NOSTRO MENÙ</h1><p>Scopri le proposte di Gusto.</p></div>
  <div id="status" class="status" role="status">Caricamento del catalogo Gusto…</div>
  <nav id="categories" aria-label="Categorie del menù"></nav>
  <div id="menu"><div class="no-products">Sto caricando i prodotti…</div></div>
  <button type="button" id="printMenuBtn">STAMPA MENÙ</button>
</main>
<footer><strong>GUSTO</strong><br>Il piacere in tavola</footer>
<script>
const SUPABASE_URL='https://aldqzoexuflliqkgabqb.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_SawSVYE4c7_3Suq63Jvi2A_ESPYm5hC';
const statusEl=document.getElementById('status');
const menuEl=document.getElementById('menu');
const categoriesEl=document.getElementById('categories');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const euro=v=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(v)||0);
function packMasonry(){
 document.querySelectorAll('[data-masonry]').forEach(container=>{
  const cards=[...container.querySelectorAll(':scope > .item')];
  if(!cards.length)return;
  const count=window.matchMedia('(max-width:480px)').matches?2:3;
  const cols=Array.from({length:count},()=>document.createElement('div'));
  cols.forEach(col=>{col.style.minWidth='0';col.style.display='flex';col.style.flexDirection='column';col.style.gap='8px';container.appendChild(col)});
  const heights=Array(count).fill(0);
  cards.forEach(card=>{
   const index=heights.indexOf(Math.min(...heights));
   cols[index].appendChild(card);
   heights[index]+=card.getBoundingClientRect().height+8;
  });
 });
}
function renderMenu(products){
 // Il catalogo condiviso conserva l'ordine deciso nel gestionale.
 // sourceIndex mantiene la posizione originale dei prodotti nell'array Supabase.
 const visible=products.map((p,sourceIndex)=>({...p,_gustoSourceIndex:sourceIndex}))
  .filter(p=>p&&p.available!==false&&p.categoryActive!==false&&String(p.name||p.nome||'').trim()&&Number.isFinite(Number(p.price??p.prezzo))&&Number(p.price??p.prezzo)>=0)
  .map(p=>({...p,name:String(p.name||p.nome).trim(),category:String(p.category||p.categoria||'Altro').trim()||'Altro',price:Number(p.price??p.prezzo),desc:String(p.desc??p.description??'').trim(),ingredients:Array.isArray(p.ingredients)?p.ingredients.map(x=>String(x??'').trim()).filter(Boolean).join(', '):String(p.ingredients??'').trim(),image:typeof p.image==='string'?p.image:''}));
 if(!visible.length){statusEl.className='status error';statusEl.textContent='Il catalogo è stato raggiunto, ma non risultano prodotti attivi con nome e prezzo validi.';menuEl.innerHTML='';categoriesEl.innerHTML='';return;}
 // L'ordine delle categorie è quello impostato nel gestionale (categoryOrder).
 // In caso di pari valore/mancanza, usa l'ordine in cui compaiono nel catalogo condiviso.
 const categoryMeta=new Map();
 visible.forEach(p=>{
  if(!categoryMeta.has(p.category))categoryMeta.set(p.category,{firstIndex:p._gustoSourceIndex,orders:[]});
  const raw=p.categoryOrder;
  if(raw!==undefined&&raw!==null&&raw!==''&&Number.isFinite(Number(raw)))categoryMeta.get(p.category).orders.push(Number(raw));
 });
 const cats=[...categoryMeta.keys()].sort((a,b)=>{
  const ma=categoryMeta.get(a),mb=categoryMeta.get(b);
  const oa=ma.orders.length?Math.min(...ma.orders):null;
  const ob=mb.orders.length?Math.min(...mb.orders):null;
  if(oa!==null&&ob!==null&&oa!==ob)return oa-ob;
  if(oa!==null&&ob===null)return -1;
  if(oa===null&&ob!==null)return 1;
  return ma.firstIndex-mb.firstIndex;
 });
 categoriesEl.innerHTML=cats.map((c,i)=>`<a class="${i===0?'active':''}" href="#cat-${i}">${esc(c)}</a>`).join('');
 menuEl.innerHTML=cats.map((cat,i)=>{
  // Ordine prodotti identico al gestionale: posizione nell'array condiviso,
  // aggiornata dal trascinamento nel gestionale e salvata su Supabase.
  const list=visible.filter(p=>p.category===cat).sort((a,b)=>a._gustoSourceIndex-b._gustoSourceIndex);
  return `<section id="cat-${i}"><div class="section-head"><h2>${esc(cat)} <span class="count">(${list.length})</span></h2></div><div class="items">${list.map(p=>{
   const image=p.image&&/^(data:image\/|https?:\/\/)/i.test(p.image)?`<img class="photo" src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`:'';
   // Mostra solo le varianti attive; se non ce n'è nessuna, usa il prezzo base.
   const activeVariants=Array.isArray(p.variants)?p.variants.filter(v=>v&&v.available!==false&&String(v.name||'').trim()&&Number.isFinite(Number(v.price))&&Number(v.price)>=0):[];
   const priceContent=activeVariants.length
    ? `<div class="variant-list" aria-label="Varianti disponibili">${activeVariants.map(v=>`<div class="variant-row"><span class="variant-name">${esc(v.name)}</span><span class="variant-price">${euro(v.price)}</span></div>`).join('')}</div>`
    : `<div class="price">${euro(p.price)}</div>`;
   return `<article class="item${image?' has-photo':''}">${image}<div class="itembody"><div class="itemtop"><div class="name">${esc(p.name)}</div>${activeVariants.length?'':priceContent}</div>${activeVariants.length?priceContent:''}${p.desc?`<div class="info-label">DESCRIZIONE</div><p class="desc">${esc(p.desc)}</p>`:''}${p.ingredients?`<div class="info-label">INGREDIENTI</div><p class="ingredients">${esc(p.ingredients)}</p>`:''}</div></article>`;
  }).join('')}</div></section>`;
 }).join('');
 statusEl.className='status';
 statusEl.textContent=`Catalogo caricato: ${visible.length} prodotti attivi in ${cats.length} categorie. Ordine sincronizzato con il gestionale.`;
 const links=[...categoriesEl.querySelectorAll('a')];
 links.forEach(a=>a.addEventListener('click',()=>{links.forEach(x=>x.classList.remove('active'));a.classList.add('active')}));
}

async function loadMenu(){
 try{
  if(!window.supabase?.createClient)throw new Error('Libreria catalogo non disponibile. Controlla la connessione.');
  const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  const {data,error}=await client.from('gusto_catalogo_prodotti').select('prodotti,updated_at').eq('id','main').maybeSingle();
  if(error)throw error;
  if(!data||!Array.isArray(data.prodotti))throw new Error('Non riesco a leggere il catalogo condiviso. Potrebbe essere necessario abilitare la lettura pubblica del catalogo.');
  renderMenu(data.prodotti);
 }catch(e){
  statusEl.className='status error';
  statusEl.textContent='Catalogo non caricato: '+(e.message||'errore di connessione')+'. Non mostro un menù incompleto o prodotti inventati.';
  menuEl.innerHTML='<div class="no-products">Per mostrare il menù completo, il catalogo condiviso deve essere leggibile dalla pagina pubblica. Nessun prodotto è stato inventato o sostituito con dati di esempio.</div>';
  categoriesEl.innerHTML='';
  console.error('Gusto menu load error',e);
 }
}
loadMenu();

 // Stampa protetta da codice: la stampa contiene i prodotti senza fotografie.
 const printMenuButton=document.getElementById('printMenuBtn');
 if(printMenuButton){
  printMenuButton.addEventListener('click',()=>{
   const code=window.prompt('Inserisci il codice di sicurezza per stampare il menù:');
   if(code===null)return;
   if(code.trim()!=='277460'){
    window.alert('Codice di sicurezza non corretto.');
    return;
   }
   if(typeof window.print==='function')window.print();
   else window.alert('La stampa non è supportata. Apri il menù in Chrome e scegli Stampa dal menu ⋮.');
  });
 }
// Mantiene il menu aggiornato anche se resta aperto su tablet/monitor.
let gustoMenuRefreshBusy=false;
async function refreshGustoDigitalMenu(){
 if(gustoMenuRefreshBusy||document.visibilityState==='hidden')return;
 gustoMenuRefreshBusy=true;
 try{await loadMenu();}finally{gustoMenuRefreshBusy=false;}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshGustoDigitalMenu();});
window.addEventListener('focus',refreshGustoDigitalMenu);
setInterval(refreshGustoDigitalMenu,30000);
</script>
</body>
</html>
